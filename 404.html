<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Not found — markfaizi.dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..600&family=Spectral:ital,wght@1,400&family=IBM+Plex+Mono:wght@400;500&family=Chakra+Petch:wght@700&display=swap">
<style>
:root{
  --font-display:"TimeBurner","Chakra Petch","Eurostile","Bahnschrift","Trebuchet MS",sans-serif;
  --font-body:"Newsreader","Iowan Old Style",Georgia,serif;
  --font-editorial:"Spectral",Georgia,"Times New Roman",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --paper:#EDEBE7;--ink:#15140F;--ink-soft:#56534A;--accent:#2E3F6B;--second:#9A6B2F;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131210;--ink:#EBE8E2;--ink-soft:#A39E95;--accent:#8CA6DE;--second:#D3A258;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131210;--ink:#EBE8E2;--ink-soft:#A39E95;--accent:#8CA6DE;--second:#D3A258;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);
  font-size:20px;line-height:1.62;min-height:100vh;display:flex;align-items:center;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:48px 24px}
.code{font-family:var(--font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--second);margin:0 0 14px}
h1{font-family:var(--font-display);font-weight:700;text-transform:uppercase;
  font-size:clamp(2rem,7vw,3rem);line-height:.98;letter-spacing:.035em;margin:0 0 18px}
p{margin:0 0 1em;color:var(--ink-soft)}
p.lede{font-family:var(--font-editorial);font-style:italic;font-size:1.2rem;color:var(--ink)}
ul{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px 22px;
  font-family:var(--font-mono);font-size:13.5px;letter-spacing:.05em}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
@media (max-width:560px){body{font-size:19px}.code,ul{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <p class="code">404</p>
  <h1>Nothing here</h1>
  <p class="lede">That page doesn't exist, or it moved.</p>
  <p>If you followed a link to an edition, try the publication's archive — every back issue is listed there.</p>
  <ul>
    <li><a href="/">markfaizi.dev</a></li>
    <li><a href="/signal/archive">Signal</a></li>
    <li><a href="/kabulledger/archive">Kabul Ledger</a></li>

</div>
</body>
</html>
